<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Gateway</title>

    <!-- Google Fonts: Doto, Space Grotesk, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800;900&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            /* Restrained, mature, human palette: matte obsidian, warm graphite, zero neon */
            --bg-canvas: #09090b;
            --bg-elevated: #141417;
            --bg-surface: #1a1a1e;
            --bg-user-bubble: #1a1a1f;
            --bg-input: rgba(18, 18, 22, 0.94);

            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-medium: rgba(255, 255, 255, 0.14);
            --border-dashed: rgba(255, 255, 255, 0.12);

            --text-primary: #ededf0;
            --text-secondary: #9a9ca6;
            --text-tertiary: #565863;

            --font-display: 'Doto', monospace;
            --font-heading: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', Menlo, monospace;

            --column-width: 740px;
            --radius-pill: 9999px;
            --radius-bubble: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: var(--font-body);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Subtle technical grid line texture */
        body {
            background-image: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 22px 22px;
            position: relative;
        }

        /* Clean Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-pill);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* -------------------------------------------------------------
           HEADER: CLEAN, TYPOGRAPHIC INSTRUMENT BAR (NO DOTS, NO EMOJIS)
           ------------------------------------------------------------- */
        header.app-header {
            height: 58px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 9, 11, 0.88);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            z-index: 50;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 16px;
            user-select: none;
        }

        /* Pure typographic brand — no colored dot */
        .brand-logo {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
        }

        /* Typographic Telemetry Badges — zero colored traffic lights */
        .telemetry-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .telemetry-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 11px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-secondary);
            user-select: none;
            transition: all 0.15s ease;
        }

        .telemetry-chip .chip-label {
            font-size: 0.64rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
        }

        .telemetry-chip .chip-val {
            font-weight: 500;
            color: var(--text-primary);
        }

        .telemetry-chip.offline .chip-val {
            color: var(--text-tertiary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Tactile Pill Buttons — clean text, no emojis */
        .pill-btn {
            font-family: var(--font-heading);
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            outline: none;
        }

        .pill-btn:hover {
            color: var(--text-primary);
            border-color: var(--border-medium);
            background: var(--bg-surface);
        }

        .pill-btn:active {
            transform: scale(0.98);
        }

        /* Custom Dropdown Menus */
        .dropdown-wrapper {
            position: relative;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--bg-elevated);
            border: 1px solid var(--border-medium);
            border-radius: 12px;
            padding: 4px;
            min-width: 240px;
            max-height: 380px;
            overflow-y: auto;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.75);
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 100;
            animation: dropdownFade 0.12s ease-out;
        }

        @keyframes dropdownFade {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            cursor: pointer;
            transition: background 0.12s ease;
            background: transparent;
            border: none;
            text-align: left;
            width: 100%;
            outline: none;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .dropdown-item.active {
            background: rgba(255, 255, 255, 0.08);
        }

        .item-title {
            font-family: var(--font-heading);
            font-size: 0.83rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-desc {
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .item-tag {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            padding: 1px 5px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
        }

        /* -------------------------------------------------------------
           CHAT CANVAS: CENTERED, FOCUSED & HUMAN
           ------------------------------------------------------------- */
        .chat-viewport {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 140px;
            scroll-behavior: smooth;
        }

        .chat-container {
            width: 100%;
            max-width: var(--column-width);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Empty State */
        .empty-state {
            margin: 12vh auto 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 560px;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-greeting {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: var(--text-primary);
        }

        .empty-caption {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.55;
        }

        .suggestion-list {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .suggestion-chip {
            background: transparent;
            border: 1px solid var(--border-dashed);
            color: var(--text-secondary);
            font-family: var(--font-heading);
            font-size: 0.82rem;
            font-weight: 400;
            padding: 7px 14px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
            user-select: none;
        }

        .suggestion-chip:hover {
            color: var(--text-primary);
            border-color: var(--border-medium);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-1px);
        }

        /* -------------------------------------------------------------
           MESSAGES: REFINED PROSE & BUBBLES (ZERO COLORED DOTS)
           ------------------------------------------------------------- */
        .message-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeIn 0.2s ease;
            width: 100%;
        }

        .message-group.user {
            align-items: flex-end;
        }

        .message-group.assistant {
            align-items: flex-start;
        }

        /* User Message Bubble: Sleek dark matte squircle */
        .user-bubble {
            background: var(--bg-user-bubble);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            font-weight: 400;
            padding: 12px 18px;
            border-radius: var(--radius-bubble);
            font-size: 0.94rem;
            line-height: 1.55;
            max-width: 82%;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        /* Assistant Response Card */
        .assistant-card {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Pure Typographic Metadata Header — zero colored dots */
        .card-meta-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-subtle);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .meta-details {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-provider {
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        .meta-sep {
            color: var(--text-tertiary);
        }

        .meta-time {
            color: var(--text-secondary);
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-link {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-family: var(--font-heading);
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.12s ease;
            outline: none;
        }

        .action-link:hover {
            color: var(--text-primary);
            border-color: var(--border-medium);
            background: rgba(255, 255, 255, 0.04);
        }

        /* Assistant Message: Clean prose */
        .assistant-message {
            width: 100%;
            font-size: 0.94rem;
            line-height: 1.7;
            color: #dedee3;
            word-wrap: break-word;
        }

        .assistant-message p {
            margin-bottom: 12px;
        }
        .assistant-message p:last-child {
            margin-bottom: 0;
        }

        .assistant-message h1,
        .assistant-message h2,
        .assistant-message h3,
        .assistant-message h4 {
            font-family: var(--font-heading);
            font-weight: 600;
            color: #ffffff;
            margin: 20px 0 10px;
            letter-spacing: -0.01em;
        }

        .assistant-message h1 { font-size: 1.25rem; }
        .assistant-message h2 { font-size: 1.12rem; }
        .assistant-message h3 { font-size: 0.98rem; }

        .assistant-message ul,
        .assistant-message ol {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .assistant-message li {
            margin-bottom: 5px;
        }

        .assistant-message code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            background: rgba(255, 255, 255, 0.07);
            padding: 2px 5px;
            border-radius: 4px;
            color: #ededf0;
        }

        .assistant-message blockquote {
            border-left: 2px solid var(--border-medium);
            padding-left: 14px;
            margin: 12px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .assistant-message hr {
            border: none;
            border-top: 1px dashed var(--border-dashed);
            margin: 18px 0;
        }

        /* Clean Table */
        .assistant-message table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
            font-size: 0.88rem;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: rgba(14, 14, 16, 0.6);
            overflow: hidden;
        }

        .assistant-message th {
            font-family: var(--font-heading);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            background: rgba(255, 255, 255, 0.04);
            padding: 9px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-subtle);
            border-right: 1px solid var(--border-subtle);
            color: #ffffff;
        }

        .assistant-message td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border-subtle);
            border-right: 1px solid var(--border-subtle);
            color: #cfcfd4;
        }

        .assistant-message tr:last-child td {
            border-bottom: none;
        }
        .assistant-message td:last-child,
        .assistant-message th:last-child {
            border-right: none;
        }

        /* Clean Code Blocks */
        .code-container {
            margin: 14px 0;
            background: #0d0d10;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 12px;
            background: #131317;
            border-bottom: 1px solid var(--border-subtle);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .code-copy-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-heading);
            font-size: 0.72rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        .code-copy-btn:hover {
            color: #ffffff;
        }

        .code-container pre {
            padding: 12px 14px;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.83rem;
            line-height: 1.55;
            color: #e5e5eb;
        }

        /* Error Message */
        .error-message {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e0e0e0;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.86rem;
            width: 100%;
        }

        /* Calm Monochrome Typing Indicator — zero red/green dots */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 5px;
            padding: 6px 0;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-bar {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-tertiary);
            animation: calmPulse 1.2s infinite ease-in-out;
        }

        .typing-bar:nth-child(2) { animation-delay: 0.18s; }
        .typing-bar:nth-child(3) { animation-delay: 0.36s; }

        @keyframes calmPulse {
            0%, 80%, 100% {
                transform: scale(0.7);
                opacity: 0.3;
            }
            40% {
                transform: scale(1.1);
                opacity: 0.9;
                background: #ededf0;
            }
        }

        /* -------------------------------------------------------------
           INPUT STATION: MATTE GRAPHITE DOCK (ZERO NEON GLOW)
           ------------------------------------------------------------- */
        .dock-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            padding: 12px 20px 22px;
            background: linear-gradient(to top, var(--bg-canvas) 75%, transparent);
            pointer-events: none;
            z-index: 50;
        }

        .input-box {
            width: 100%;
            max-width: var(--column-width);
            background: var(--bg-input);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-pill);
            padding: 8px 10px 8px 20px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
            transition: all 0.18s ease;
            pointer-events: auto;
        }

        .input-box:focus-within {
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75);
            background: rgba(22, 22, 27, 0.98);
        }

        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.94rem;
            line-height: 1.5;
            max-height: 150px;
            resize: none;
            padding: 7px 0;
        }

        .message-input::placeholder {
            color: var(--text-tertiary);
            font-family: var(--font-heading);
            font-size: 0.88rem;
        }

        /* Tactile Monochrome Dispatch Button — no glowing red orb */
        .dispatch-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #242429;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
            flex-shrink: 0;
        }

        .dispatch-btn:hover {
            transform: scale(1.05);
            background: #2f2f36;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .dispatch-btn:active {
            transform: scale(0.95);
        }

        .dispatch-btn:disabled {
            background: rgba(255, 255, 255, 0.05);
            border-color: transparent;
            color: var(--text-tertiary);
            cursor: not-allowed;
            transform: none;
        }

        .dispatch-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* -------------------------------------------------------------
           RESPONSIVE
           ------------------------------------------------------------- */
        @media (max-width: 820px) {
            .telemetry-bar {
                display: none;
            }
            .chat-viewport {
                padding: 16px 14px 120px;
            }
            .dock-bar {
                padding: 10px 14px 16px;
            }
            .empty-greeting {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>

    <!-- HUMANE HEADER: CLEAN TYPOGRAPHY (ZERO DOTS, ZERO EMOJIS) -->
    <header class="app-header">
        <div class="brand-section">
            <div class="brand-logo">
                <span>( GATEWAY )</span>
            </div>

            <!-- Typographic Telemetry (Numbers, no traffic lights) -->
            <div class="telemetry-bar">
                <div class="telemetry-chip" id="cloudTelemetry" title="Groq Cloud API">
                    <span class="chip-label">Cloud</span>
                    <span class="chip-val" id="cloudLatency">Checking...</span>
                </div>
                <div class="telemetry-chip" id="localTelemetry" title="Local Ollama Daemon">
                    <span class="chip-label">Local</span>
                    <span class="chip-val" id="localLatency">Checking...</span>
                </div>
            </div>
        </div>

        <div class="header-actions">
            <!-- Provider Selector Pill (Clean Text, No Emojis) -->
            <div class="dropdown-wrapper">
                <button class="pill-btn" id="providerSelectBtn" onclick="toggleDropdown('providerDropdown')">
                    <span id="currentProviderLabel">Groq (Cloud)</span>
                    <span style="font-size: 0.7rem; opacity: 0.6;">▾</span>
                </button>
                <div class="dropdown-menu" id="providerDropdown">
                    <button class="dropdown-item active" onclick="selectProvider('groq', 'Groq (Cloud)')">
                        <span class="item-title">
                            Groq (Cloud)
                            <span class="item-tag">Remote</span>
                        </span>
                        <span class="item-desc">High-throughput cloud inference engine</span>
                    </button>
                    <button class="dropdown-item" onclick="selectProvider('ollama', 'Ollama (Local)')">
                        <span class="item-title">
                            Ollama (Local)
                            <span class="item-tag">Offline</span>
                        </span>
                        <span class="item-desc">Private on-device inference via Ollama</span>
                    </button>
                </div>
            </div>

            <!-- Model Selector Pill -->
            <div class="dropdown-wrapper">
                <button class="pill-btn" id="modelSelectBtn" onclick="toggleDropdown('modelDropdown')">
                    <span id="currentModelLabel">Loading models...</span>
                    <span style="font-size: 0.7rem; opacity: 0.6;">▾</span>
                </button>
                <div class="dropdown-menu" id="modelDropdown">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- New Chat Reset -->
            <button class="pill-btn" onclick="clearChat()" title="Start a fresh conversation">
                <span>+ New chat</span>
            </button>
        </div>
    </header>

    <!-- MAIN CHAT CANVAS -->
    <main class="chat-viewport" id="chatViewport">
        <div class="chat-container" id="chatContainer">
            
            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <div class="empty-greeting">( HELLO )</div>
                <div class="empty-caption">Provider-agnostic inference gateway. Test prompts across Cloud and Local models.</div>
                <div class="suggestion-list" id="suggestionList"></div>
            </div>

        </div>

        <!-- Calm Typing Indicator (Neutral Grayscale, No Colored Dots) -->
        <div class="chat-container">
            <div class="typing-indicator" id="typingIndicator">
                <span class="typing-bar"></span>
                <span class="typing-bar"></span>
                <span class="typing-bar"></span>
            </div>
        </div>
    </main>

    <!-- FLOATING DOCK -->
    <div class="dock-bar">
        <div class="input-box">
            <textarea 
                id="messageInput" 
                class="message-input" 
                rows="1" 
                placeholder="Ask anything..." 
                onkeydown="handleKey(event)"
                oninput="handleInputResize(this)"></textarea>
            
            <button class="dispatch-btn" id="sendBtn" onclick="sendMessage()" title="Send">
                <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let currentProvider = "groq";
        let currentModel = "";
        let systemStatus = {};
        let hasMessages = false;

        // Clean model registry — zero emojis
        const MODEL_META = {
            "openai/gpt-oss-120b": { name: "GPT-120B", desc: "Flagship reasoning & deep analysis" },
            "openai/gpt-oss-20b": { name: "GPT-20B", desc: "Fast, low-latency responses" },
            "qwen/qwen3.8-27b": { name: "Qwen-27B", desc: "Balanced multilingual model" },
            "llama3.2:1b": { name: "Llama-3.2 (1B)", desc: "Quantized lightweight local model" },
            "llama3.2:3b": { name: "Llama-3.2 (3B)", desc: "Balanced local edge model" },
            "llama3.1:8b": { name: "Llama-3.1 (8B)", desc: "High-capability local model" }
        };

        // Dropdown toggling
        function toggleDropdown(id) {
            const dropdown = document.getElementById(id);
            const isShown = dropdown.classList.contains("show");
            closeAllDropdowns();
            if (!isShown) {
                dropdown.classList.add("show");
            }
        }

        function closeAllDropdowns() {
            document.querySelectorAll(".dropdown-menu").forEach(d => d.classList.remove("show"));
        }

        window.addEventListener("click", (e) => {
            if (!e.target.closest(".dropdown-wrapper")) {
                closeAllDropdowns();
            }
        });

        // Provider Selection (No emojis)
        function selectProvider(providerKey, label) {
            currentProvider = providerKey;
            document.getElementById("currentProviderLabel").innerText = label;
            document.querySelectorAll("#providerDropdown .dropdown-item").forEach(item => {
                item.classList.toggle("active", item.getAttribute("onclick").includes(`'${providerKey}'`));
            });
            closeAllDropdowns();
            updateModelDropdown();
        }

        // Model Selection
        function selectModel(modelId, label) {
            currentModel = modelId;
            document.getElementById("currentModelLabel").innerText = label;
            document.querySelectorAll("#modelDropdown .dropdown-item").forEach(item => {
                item.classList.toggle("active", item.getAttribute("data-model-id") === modelId);
            });
            closeAllDropdowns();
        }

        // Rebuild Model Dropdown based on active Provider
        function updateModelDropdown() {
            const dropdown = document.getElementById("modelDropdown");
            dropdown.innerHTML = "";

            const models = systemStatus[currentProvider]?.models || [];

            if (models.length === 0) {
                const emptyItem = document.createElement("div");
                emptyItem.className = "dropdown-item";
                emptyItem.innerHTML = `<span class="item-title">No models detected</span><span class="item-desc">Ensure provider is running</span>`;
                dropdown.appendChild(emptyItem);
                currentModel = "";
                document.getElementById("currentModelLabel").innerText = "No models";
                return;
            }

            models.forEach((mId, index) => {
                const meta = MODEL_META[mId] || { name: mId, desc: "General-purpose model" };
                const btn = document.createElement("button");
                btn.className = "dropdown-item";
                btn.setAttribute("data-model-id", mId);
                btn.onclick = () => selectModel(mId, meta.name);

                btn.innerHTML = `
                    <span class="item-title">${escapeHtml(meta.name)}</span>
                    <span class="item-desc">${escapeHtml(meta.desc)}</span>
                `;

                dropdown.appendChild(btn);

                // Auto-select preferred default
                if (index === 0 || (currentProvider === "groq" && mId === "openai/gpt-oss-120b") || (currentProvider === "ollama" && mId === "llama3.2:1b")) {
                    currentModel = mId;
                    document.getElementById("currentModelLabel").innerText = meta.name;
                    btn.classList.add("active");
                }
            });
        }

        // Load Live System Status & Typographic Telemetry
        async function loadStatus() {
            try {
                const res = await fetch("/api/status");
                systemStatus = await res.json();

                // Groq Telemetry
                const groqConn = systemStatus.groq?.connection;
                const cloudChip = document.getElementById("cloudTelemetry");
                const cloudLatency = document.getElementById("cloudLatency");
                if (groqConn && groqConn.status === "online") {
                    cloudChip.className = "telemetry-chip";
                    cloudLatency.innerText = `${Math.round(groqConn.latency_ms)}ms`;
                } else {
                    cloudChip.className = "telemetry-chip offline";
                    cloudLatency.innerText = "Offline";
                }

                // Ollama Telemetry
                const ollamaConn = systemStatus.ollama?.connection;
                const localChip = document.getElementById("localTelemetry");
                const localLatency = document.getElementById("localLatency");
                if (ollamaConn && ollamaConn.status === "online") {
                    localChip.className = "telemetry-chip";
                    localLatency.innerText = `${Math.round(ollamaConn.latency_ms)}ms`;
                } else {
                    localChip.className = "telemetry-chip offline";
                    localLatency.innerText = "Offline";
                }

                updateModelDropdown();
            } catch (err) {
                console.error("Failed to fetch system status:", err);
                document.getElementById("cloudLatency").innerText = "Unavailable";
                document.getElementById("localLatency").innerText = "Unavailable";
            }
        }

        // Textarea auto-resize
        function handleInputResize(textarea) {
            textarea.style.height = "auto";
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + "px";
        }

        function handleKey(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function applySuggestion(text) {
            const input = document.getElementById("messageInput");
            input.value = text;
            handleInputResize(input);
            sendMessage();
        }

        // Markdown Formatting via marked.js
        function formatMarkdown(text) {
            if (!text) return "";
            if (typeof marked !== "undefined" && marked.parse) {
                try {
                    const renderer = new marked.Renderer();
                    renderer.code = function (code, lang) {
                        const codeContent = typeof code === 'object' ? code.text : code;
                        const language = (typeof code === 'object' ? code.lang : lang) || "code";
                        const escaped = escapeHtml(codeContent);
                        return `
                            <div class="code-container">
                                <div class="code-header">
                                    <span>${escapeHtml(language.toLowerCase())}</span>
                                    <button class="code-copy-btn" onclick="copyCode(this)">Copy</button>
                                </div>
                                <pre><code>${escaped}</code></pre>
                            </div>
                        `;
                    };
                    return marked.parse(text, { renderer: renderer, gfm: true, breaks: true });
                } catch (e) {
                    console.error("Marked parsing error:", e);
                }
            }
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function copyCode(btn) {
            const pre = btn.closest(".code-container").querySelector("pre code");
            navigator.clipboard.writeText(pre.innerText).then(() => {
                btn.innerText = "Copied";
                setTimeout(() => { btn.innerText = "Copy"; }, 2000);
            });
        }

        function copyMarkdown(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                btn.innerText = "Copied";
                setTimeout(() => { btn.innerText = "Copy"; }, 2000);
            });
        }

        // Re-run the same prompt on the opposing engine
        function reRunOnOpposite(targetProvider, promptText) {
            const label = targetProvider === "groq" ? "Groq (Cloud)" : "Ollama (Local)";
            selectProvider(targetProvider, label);
            sendMessage(promptText);
        }

        // Append User Message
        function appendUserMessage(text) {
            const container = document.getElementById("chatContainer");
            const emptyState = document.getElementById("emptyState");
            if (emptyState) emptyState.style.display = "none";
            hasMessages = true;

            const group = document.createElement("div");
            group.className = "message-group user";

            const bubble = document.createElement("div");
            bubble.className = "user-bubble";
            bubble.innerText = text;

            group.appendChild(bubble);
            container.appendChild(group);
            scrollToBottom();
        }

        // Append Assistant Message with Clean Typographic Header (Zero Dots)
        function appendAssistantMessage(data, sourcePrompt) {
            const container = document.getElementById("chatContainer");
            const group = document.createElement("div");
            group.className = "message-group assistant";

            const card = document.createElement("div");
            card.className = "assistant-card";

            const isGroq = (data.provider || "").toLowerCase().includes("groq");
            const oppositeProvider = isGroq ? "ollama" : "groq";
            const oppositeName = isGroq ? "Local" : "Cloud";

            // Header Bar: provider, model, latency, copy & re-run action
            const metaBar = document.createElement("div");
            metaBar.className = "card-meta-bar";
            metaBar.innerHTML = `
                <div class="meta-details">
                    <span class="meta-provider">${escapeHtml(data.provider || "Gateway")}</span>
                    <span class="meta-sep">/</span>
                    <span class="meta-model">${escapeHtml(data.model || "")}</span>
                    <span class="meta-sep">/</span>
                    <span class="meta-time">${escapeHtml(String(data.time_sec || "0"))}s</span>
                </div>
                <div class="card-actions">
                    <button class="action-link" onclick="copyMarkdown(this, ${JSON.stringify(data.reply || '')})">Copy Markdown</button>
                    <button class="action-link" onclick="reRunOnOpposite('${oppositeProvider}', ${JSON.stringify(sourcePrompt)})" title="Test this exact prompt on ${oppositeName}">Compare with ${oppositeName}</button>
                </div>
            `;

            const messageBody = document.createElement("div");
            messageBody.className = "assistant-message";
            messageBody.innerHTML = formatMarkdown(data.reply || "");

            card.appendChild(metaBar);
            card.appendChild(messageBody);
            group.appendChild(card);
            container.appendChild(group);
            scrollToBottom();
        }

        function appendErrorMessage(text) {
            const container = document.getElementById("chatContainer");
            const group = document.createElement("div");
            group.className = "message-group assistant";

            const err = document.createElement("div");
            err.className = "error-message";
            err.innerText = text;

            group.appendChild(err);
            container.appendChild(group);
            scrollToBottom();
        }

        function scrollToBottom() {
            const viewport = document.getElementById("chatViewport");
            viewport.scrollTop = viewport.scrollHeight;
        }

        // Send Message
        async function sendMessage(explicitText = null) {
            const input = document.getElementById("messageInput");
            const sendBtn = document.getElementById("sendBtn");
            const typing = document.getElementById("typingIndicator");
            const text = (explicitText !== null ? explicitText : input.value).trim();

            if (!text) return;

            if (explicitText === null) {
                input.value = "";
                input.style.height = "auto";
            }

            appendUserMessage(text);
            sendBtn.disabled = true;
            typing.classList.add("active");
            scrollToBottom();

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        prompt: text,
                        message: text,
                        provider: currentProvider,
                        model: currentModel
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    appendAssistantMessage(data, text);
                } else {
                    appendErrorMessage(data.error || "Inference error returned from Model Gateway.");
                }
            } catch (err) {
                appendErrorMessage("Connection error: Unable to reach Gateway server at http://127.0.0.1:5000.");
            } finally {
                sendBtn.disabled = false;
                typing.classList.remove("active");
                input.focus();
                scrollToBottom();
            }
        }

        // Thoughtful, developer-relevant suggestions — zero emojis, zero clichés
        const SIMPLE_SUGGESTIONS = [
            { label: "Cloud vs Local Trade-offs", prompt: "Summarize the key architectural trade-offs between Cloud inference APIs and Local quantized LLMs in 3 concise points." },
            { label: "4-bit GGUF Quantization", prompt: "Explain how 4-bit GGUF quantization works and why it cuts memory footprint with minimal perplexity degradation." },
            { label: "Streaming Log Parser in Python", prompt: "Write an efficient Python generator function that streams a multi-gigabyte log file and extracts timestamped error lines." },
            { label: "Recursive vs Dynamic Fibonacci", prompt: "Compare the time and space complexity of recursive Fibonacci versus dynamic programming with memoization." },
            { label: "Explain Tokens in LLMs", prompt: "Explain why large language models process text in sub-word tokens rather than raw characters or dictionary words." },
            { label: "Decline Meeting Invite", prompt: "Draft a concise, polite email declining a meeting invite due to schedule conflicts." }
        ];

        let lastSuggestedLabels = new Set();

        function renderRandomSuggestions() {
            const list = document.getElementById("suggestionList");
            if (!list) return;

            let candidates = SIMPLE_SUGGESTIONS.filter(item => !lastSuggestedLabels.has(item.label));
            if (candidates.length < 3) {
                candidates = [...SIMPLE_SUGGESTIONS];
            }

            for (let i = candidates.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }

            const selected = candidates.slice(0, 3);
            lastSuggestedLabels = new Set(selected.map(item => item.label));

            list.innerHTML = "";
            selected.forEach(item => {
                const btn = document.createElement("button");
                btn.className = "suggestion-chip";
                btn.textContent = item.label;
                btn.onclick = () => applySuggestion(item.prompt);
                list.appendChild(btn);
            });
        }

        // New Chat Reset
        function clearChat() {
            const container = document.getElementById("chatContainer");
            container.innerHTML = `
                <div class="empty-state" id="emptyState">
                    <div class="empty-greeting">( HELLO )</div>
                    <div class="empty-caption">Provider-agnostic inference gateway. Test prompts across Cloud and Local models.</div>
                    <div class="suggestion-list" id="suggestionList"></div>
                </div>
            `;
            hasMessages = false;
            renderRandomSuggestions();
            document.getElementById("messageInput").value = "";
            document.getElementById("messageInput").style.height = "auto";
            document.getElementById("messageInput").focus();
        }

        // Initial Load
        renderRandomSuggestions();
        loadStatus();
    </script>
</body>
</html>
